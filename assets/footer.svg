<svg
  width="1200"
  height="170"
  viewBox="0 0 1200 170"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Back wave -->
  <path
    fill="#87CEEB"
    opacity="0.4"
    d="M0 60
       C200 10 400 115 600 60
       C800 10 1000 115 1200 55
       L1200 170
       L0 170 Z"
  >
    <animate
      attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      values="
      M0 60 C200 10 400 115 600 60 C800 10 1000 115 1200 55 L1200 170 L0 170 Z;
      M0 50 C200 110 400 10 600 55 C800 115 1000 10 1200 65 L1200 170 L0 170 Z;
      M0 60 C200 10 400 115 600 60 C800 10 1000 115 1200 55 L1200 170 L0 170 Z
      "
    />
  </path>

  <!-- Front wave -->
  <path
    fill="url(#skyGradient)"
    d="M0 70
       C200 20 400 125 600 70
       C800 15 1000 120 1200 65
       L1200 170
       L0 170 Z"
  >
    <animate
      attributeName="d"
      dur="4s"
      repeatCount="indefinite"
      values="
      M0 70 C200 20 400 125 600 70 C800 15 1000 120 1200 65 L1200 170 L0 170 Z;
      M0 65 C200 125 400 20 600 65 C800 125 1000 25 1200 75 L1200 170 L0 170 Z;
      M0 70 C200 20 400 125 600 70 C800 15 1000 120 1200 65 L1200 170 L0 170 Z
      "
    />
  </path>

</svg>
